<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngrid Online Banking</title>
<style>
  :root{--line:#e3e6eb;--mut:#6b7280;--brand:#0b5cad;--brand2:#0a4e94;--ok:#0a7d3c;--bad:#b00020;--bg:#eef1f5}
  *{box-sizing:border-box}
  body{font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;margin:0;color:#111827;background:var(--bg)}
  button{font:13px sans-serif;padding:8px 14px;cursor:pointer;border:1px solid #c3c9d2;border-radius:6px;background:#fff}
  button:hover{background:#f3f5f8}
  button.pri{background:var(--brand);border-color:var(--brand);color:#fff}
  button.pri:hover{background:var(--brand2)}
  input,select{font:13px sans-serif;padding:8px 9px;border:1px solid #cbd0d8;border-radius:6px;width:100%;background:#fff}
  label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}
  .hidden{display:none!important}

  #login{max-width:380px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:30px;box-shadow:0 2px 12px rgba(16,32,64,.08)}
  #login .logo{font-weight:800;color:var(--brand);font-size:20px;letter-spacing:-.3px}
  #login h1{font-size:16px;margin:14px 0 2px}
  #login .sub{color:var(--mut);font-size:12.5px;margin-bottom:20px}
  #login .f{margin-bottom:14px}
  #login button{width:100%;margin-top:6px}
  #loginErr{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px}

  header{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px}
  header .logo{font-weight:800;color:var(--brand);font-size:17px}
  header .who{font-size:12.5px;color:var(--mut)}
  header .bal{margin-left:auto;text-align:right}
  header .bal b{font-size:16px}header .bal span{display:block;font-size:11px;color:var(--mut)}
  main{max-width:900px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:740px){main{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .card.full{grid-column:1/-1}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);margin:0 0 12px}
  .row{display:flex;gap:10px}.row>div{flex:1}
  .mt{margin-top:12px}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
  th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase}
  .money{font-variant-numeric:tabular-nums}
  .msg{font-size:13px;margin-top:10px;white-space:pre-wrap;word-break:break-word}
  .msg.ok{color:var(--ok)}.msg.err{color:var(--bad)}
  .foot{color:var(--mut);font-size:12px}
</style>
</head>
<body>

<div id="login">
  <div class="logo">Ngrid Bank</div>
  <h1>Online Banking</h1>
  <div class="sub">Sign in to your account</div>
  <div class="f"><label>Username</label><input id="username" autocomplete="username"></div>
  <div class="f"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
  <button class="pri" onclick="doLogin()">Sign in</button>
  <div id="loginErr"></div>
</div>

<header id="appHeader" class="hidden">
  <span class="logo">Ngrid Bank</span>
  <span class="who" id="who"></span>
  <div class="bal"><b class="money" id="hdrBal">—</b><span>available balance</span></div>
  <button onclick="logout()">Sign out</button>
</header>

<main id="app" class="hidden">
  <div class="card full">
    <h2>Your accounts</h2>
    <div id="myAccounts" class="foot">Loading…</div>
  </div>

  <div class="card">
    <h2>Make a transfer</h2>
    <div><label>From account</label><select id="tFrom"></select></div>
    <div class="row mt">
      <div><label>To account</label><input id="tTo" placeholder="account number"></div>
      <div><label>Amount</label><input id="tAmt" placeholder="0.00"></div>
    </div>
    <div class="mt"><label>Memo</label><input id="tMemo" placeholder="e.g. rent"></div>
    <button class="pri mt" onclick="doTransfer()">Send transfer</button>
    <div id="transferMsg" class="msg"></div>
  </div>

  <div class="card">
    <h2>Recent activity</h2>
    <div><label>Account</label><select id="txAcct" onchange="loadTransfers()"></select></div>
    <div id="txOut" class="mt foot">—</div>
  </div>
</main>

<script>
const API={ login:'/api/auth/login', accounts:'/api/accounts', transfer:'/api/transfers' };
let STATE={token:null,subject:null,accounts:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const money=(m,c)=>{const n=Number(m);return isFinite(n)?(n/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+(c?' '+c:''):String(m);};

// The lab edge-proxy intermittently throws transient 4xx/5xx/connection blips.
// Retry idempotent reads a few times so one blip can't blank the dashboard.
// Never auto-retried: the transfer POST (non-idempotent) — opts out via retry:1.
async function api(method,path,body,opts){
  const retries=(opts&&opts.retry!=null)?opts.retry:(method==='GET'?3:1);
  const headers={};
  if(body!==undefined) headers['Content-Type']='application/json';
  if(STATE.token) headers['Authorization']='Bearer '+STATE.token;
  let last;
  for(let attempt=1;attempt<=retries;attempt++){
    try{
      const res=await fetch(path,{method,headers,body:body!==undefined?JSON.stringify(body):undefined});
      const text=await res.text();
      let json=null; try{json=JSON.parse(text);}catch(_){}
      last={res,text,json,ok:res.ok};
      if(res.ok) return last;            // success — done
    }catch(e){ last={res:null,text:String(e&&e.message||e),json:null,ok:false}; }
    if(attempt<retries) await new Promise(r=>setTimeout(r,150*attempt));  // brief backoff
  }
  return last;                           // exhausted retries — return last outcome
}

async function doLogin(){
  $('loginErr').textContent='';
  const username=$('username').value.trim(), password=$('password').value;
  if(!username){$('loginErr').textContent='Enter your username.';return;}
  let r;
  try{ r=await api('POST',API.login,{username,password},{retry:3}); }
  catch(e){ $('loginErr').textContent='Cannot reach the server. Please try again.'; return; }
  if(r.ok && r.json && r.json.token){
    STATE.token=r.json.token; STATE.subject=username;
    enterApp();
  }else{
    $('loginErr').textContent='Sign in failed. Check your details and try again.';
  }
}
function enterApp(){
  $('login').classList.add('hidden');
  $('appHeader').classList.remove('hidden');
  $('app').classList.remove('hidden');
  $('who').textContent='Signed in as '+STATE.subject;
  loadAccounts();
}
function logout(){
  STATE={token:null,subject:null,accounts:[]};
  $('app').classList.add('hidden'); $('appHeader').classList.add('hidden');
  $('login').classList.remove('hidden'); $('password').value='';
}

async function loadAccounts(){
  const {json,ok}=await api('GET',API.accounts+'?owner='+encodeURIComponent(STATE.subject));
  STATE.accounts=(ok&&Array.isArray(json))?json:[];
  renderAccounts(); fillAccountSelects();
  if(STATE.accounts[0]){ $('hdrBal').textContent=money(STATE.accounts[0].balance_minor,STATE.accounts[0].currency); loadTransfers(); }
  else $('hdrBal').textContent='—';
}
function renderAccounts(){
  const rows=STATE.accounts;
  $('myAccounts').innerHTML = rows.length
    ? '<table><tr><th>Account</th><th>Currency</th><th>Balance</th></tr>'+
      rows.map(a=>'<tr><td>'+esc(a.id)+'</td><td>'+esc(a.currency)+'</td><td class="money">'+esc(money(a.balance_minor,a.currency))+'</td></tr>').join('')+'</table>'
    : '<div class="foot">No accounts found for this profile.</div>';
}
function fillAccountSelects(){
  const opts=STATE.accounts.map(a=>'<option value="'+esc(a.id)+'">'+esc(a.id)+' · '+esc(money(a.balance_minor,a.currency))+'</option>').join('');
  $('tFrom').innerHTML=opts; $('txAcct').innerHTML=opts;
}
async function loadTransfers(){
  const id=$('txAcct').value; if(!id)return;
  const {json,ok}=await api('GET',API.accounts+'/'+id+'/transfers');
  if(ok&&Array.isArray(json)){
    $('txOut').innerHTML = json.length
      ? '<table><tr><th>Date</th><th>From</th><th>To</th><th>Amount</th><th>Memo</th></tr>'+
        json.map(t=>'<tr><td class="foot">'+esc((t.created_at||'').slice(0,10))+'</td><td>'+esc(t.from_account)+'</td><td>'+esc(t.to_account)+'</td><td class="money">'+esc(money(t.amount_minor))+'</td><td>'+esc(t.memo||'')+'</td></tr>').join('')+'</table>'
      : '<div class="foot">No recent activity.</div>';
  }else $('txOut').innerHTML='<div class="msg err">Could not load activity.</div>';
}
async function doTransfer(){
  const from=$('tFrom').value, toRaw=$('tTo').value.trim(), amtRaw=$('tAmt').value.trim();
  if(!toRaw||!amtRaw){ msg($('transferMsg'),false,'Enter a destination account and an amount.'); return; }
  const body={from:Number(from),to:Number(toRaw),amountMinor:Math.round(Number(amtRaw)*100),memo:$('tMemo').value};
  const {json,text,ok}=await api('POST',API.transfer,body);
  if(ok&&json&&json.status==='POSTED') msg($('transferMsg'),true,'Transfer complete. New balance: '+money(json.fromBalanceAfter));
  else msg($('transferMsg'),false,(ok&&json)?('Transfer declined: '+(json.reason||json.status||'')):'Transfer could not be completed.');
  loadAccounts();
}
function msg(el,ok,m){el.className='msg '+(ok?'ok':'err');el.textContent=m;}

$('password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
$('username').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
</body>
</html>
